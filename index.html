<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彭祈文｜作品首頁</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f1f1c;
      --muted: #6b6b66;
      --line: #e9e9e6;
      --hover: #f1f5ff;
      --accent: #4f7cff;
      --shadow: 0 18px 40px rgba(31, 31, 28, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 72px 24px 48px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .intro {
      margin: 18px 0 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .section-title {
      margin: 56px 0 18px;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .list {
      display: grid;
      gap: 14px;
    }

    .work-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px 22px;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .work-card:hover {
      transform: translateY(-2px);
      background: var(--hover);
      border-color: #dbe5ff;
    }

    .week {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .title {
      font-size: 1.18rem;
      font-weight: 700;
      margin: 0;
    }

    .desc {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.96rem;
    }

    .arrow {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .footer {
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.8;
    }

    code {
      background: #fff;
      border: 1px solid var(--line);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    @media (max-width: 640px) {
      .wrap {
        padding-top: 52px;
      }

      .work-card {
        align-items: flex-start;
      }

      .arrow {
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Peng Chi-Wen ・ Frontend Works</div>
    <h1>我的每週作品集</h1>
    <p class="intro">
      這裡整理我每週的前端作業與小作品。整體維持簡潔、清楚、好瀏覽的風格，之後也可以持續擴充成自己的 GitHub 作品首頁。
    </p>

    <h2 class="section-title">Weekly Works</h2>
    <section class="list">
      <a class="work-card" href="./week3/index.html">
        <div>
          <div class="week">Week 3</div>
          <p class="title">數位名片 Single Page Application</p>
          <p class="desc">Notion 風格的個人數位名片，包含圓形頭像、社群按鈕，以及點擊背景隨機切換天空藍色系的互動效果。</p>
        </div>
        <div class="arrow">→</div>
      </a>
    </section>

  </main>
</body>
</html>
