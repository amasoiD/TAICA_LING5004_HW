<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 8 · Ollama 安裝與本地模型操作</title>
  <style>
    :root {
      --text: #1f1f1c;
      --muted: #6b6b66;
      --line: rgba(255,255,255,0.3);
      --hover: rgba(255,255,255,0.6);
      --accent: #4f7cff;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.12)), #cfedff;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .wrap {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 72px 24px 48px;
      background: rgba(255,255,255,0.2);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.3);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 24px;
      transition: opacity 0.18s ease;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.8;
      color: var(--text);
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin: 20px 0;
    }

    @media (max-width: 640px) {
      .wrap {
        padding-top: 52px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="https://amasoid.github.io/TAICA_LING5004_HW">← Home</a>
    <div class="eyebrow">Week 8 · Ollama 安裝與本地模型操作</div>

    <div class="content">
      <h1>🤖 Ollama 安裝與本地模型對話</h1>

      <p>本週作業展示 Ollama 的安裝過程以及與本地語言模型的對話記錄。以下是與本地模型互動的截圖：</p>

      <img src="./week8.png" alt="Ollama 本地模型對話截圖">
    </div>
  </main>
</body>
</html>
