<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彭祈文｜數位名片</title>
  <style>
    :root {
      --text: #202124;
      --muted: #4f647d;
      --card: rgba(255, 255, 255, 0.78);
      --border: rgba(60, 64, 67, 0.12);
      --shadow: 0 20px 50px rgba(82, 115, 153, 0.14);
      --button-bg: rgba(255, 255, 255, 0.9);
      --button-text: #1f2d3d;
      --button-border: rgba(60, 64, 67, 0.1);
      --button-hover-bg: #ffffff;
      --hint: #61758d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.12)), #cfe4ff;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background 0.45s ease, color 0.3s ease;
      cursor: pointer;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 40px 28px 32px;
      text-align: center;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .avatar {
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.82);
      box-shadow: 0 10px 30px rgba(110, 154, 201, 0.24);
      overflow: hidden;
      display: grid;
      place-items: center;
      transition: transform 0.3s ease;
    }


    .avatar:hover {
      transform: scale(1.03) rotate(2deg);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 26ch;
      line-height: 1.7;
      color: var(--muted);
      font-size: 1rem;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      text-decoration: none;
      color: var(--button-text);
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 999px;
      padding: 12px 18px;
      min-width: 112px;
      font-size: 0.96rem;
      font-weight: 500;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 6px 20px rgba(80, 110, 140, 0.08);
    }

    .button:hover {
      transform: translateY(-2px);
      background: var(--button-hover-bg);
      box-shadow: 0 10px 24px rgba(80, 110, 140, 0.12);
    }

    .hint {
      margin-top: 22px;
      font-size: 0.84rem;
      color: var(--hint);
      transition: color 0.3s ease;
    }

    @media (max-width: 520px) {
      .card {
        padding: 32px 20px 24px;
        border-radius: 24px;
      }

      .avatar {
        width: 120px;
        height: 120px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      color: var(--text);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      z-index: 10;
    }

    .home-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.8);
    }

  </style>
</head>
<body>
  <a href="../index.html" class="home-btn">← Home</a>
  <main class="card">
    <div class="avatar" id="avatar">
      <img src="https://raw.githubusercontent.com/amasoiD/TAICA_LING5004_HW/refs/heads/main/week3/images/icon.png" alt="profile" />
    </div>

    <audio id="easterEgg" src="https://raw.githubusercontent.com/amasoiD/TAICA_LING5004_HW/refs/heads/main/week3/images/EasterEgg.ogg" preload="auto"></audio>
    <h1>彭祈文</h1>
    <p class="subtitle">我是熱愛遊戲的交大學生。</p>

    <div class="actions">
      <a class="button" href="https://www.instagram.com/amasoid/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="button" href="https://github.com/amasoiD" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="button" href="mailto:amasoid.sc12@nycu.edu.tw">Email</a>
    </div>

    <p class="hint" id="hint">點擊卡片外的背景，切換成黑夜模式。</p>
  </main>

  <script>
    const root = document.documentElement;
    const hint = document.getElementById('hint');

    const avatar = document.getElementById('avatar');
    const easterEgg = document.getElementById('easterEgg');

    avatar.addEventListener('click', (event) => {
      event.stopPropagation(); // 避免點頭像時順便觸發背景切換

      easterEgg.currentTime = 0;
      easterEgg.play().catch(() => {
        console.log('音效播放失敗');
      });
    });

    const img = avatar.querySelector('img');

    let angle = 0;
    let rotating = false;
    let lastTime = null;

    function animate(time) {
      if (!rotating) return;

      if (!lastTime) lastTime = time;
      const delta = (time - lastTime) / 1000; // 秒
      lastTime = time;

      angle += 72 * delta; // 36度/秒
      img.style.transform = `rotate(${angle}deg)`;

      requestAnimationFrame(animate);
    }

    // 滑鼠進入 → 開始旋轉
    avatar.addEventListener('mouseenter', () => {
      if (!rotating) {
        rotating = true;
        lastTime = null;
        requestAnimationFrame(animate);
      }
    });

    // 滑鼠離開 → 停止（保留角度）
    avatar.addEventListener('mouseleave', () => {
      rotating = false;
    });

    let bingImageUrl = '';

    const themes = [
      {
        mode: 'sky',
        background: 'linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.12)), #cfe4ff',
        text: '#202124',
        muted: '#4f647d',
        card: 'rgba(255, 255, 255, 0.78)',
        border: 'rgba(60, 64, 67, 0.12)',
        shadow: '0 20px 50px rgba(82, 115, 153, 0.14)',
        buttonBg: 'rgba(255, 255, 255, 0.9)',
        buttonText: '#1f2d3d',
        buttonBorder: 'rgba(60, 64, 67, 0.1)',
        buttonHoverBg: '#ffffff',
        hintColor: '#61758d',
        hint: '點擊卡片外的背景，切換成黑夜模式。'
      },
      {
        mode: 'dark',
        background: 'linear-gradient(180deg, rgba(7,12,24,0.94), rgba(10,18,36,0.86)), #0b1220',
        text: '#f5f7fb',
        muted: '#c2cad8',
        card: 'rgba(17, 25, 40, 0.72)',
        border: 'rgba(148, 163, 184, 0.18)',
        shadow: '0 24px 60px rgba(0, 0, 0, 0.35)',
        buttonBg: 'rgba(255, 255, 255, 0.14)',
        buttonText: '#f5f7fb',
        buttonBorder: 'rgba(255, 255, 255, 0.16)',
        buttonHoverBg: 'rgba(255, 255, 255, 0.2)',
        hintColor: '#94a3b8',
        hint: '點擊卡片外的背景，切換成 Bing 每日桌布。'
      },
      {
        mode: 'bing',
        background: 'linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.42)), #1c2333',
        text: '#f8fbff',
        muted: '#d7e3f3',
        card: 'rgba(255, 255, 255, 0.22)',
        border: 'rgba(255, 255, 255, 0.18)',
        shadow: '0 24px 60px rgba(0, 0, 0, 0.28)',
        buttonBg: 'rgba(255, 255, 255, 0.16)',
        buttonText: '#ffffff',
        buttonBorder: 'rgba(255, 255, 255, 0.22)',
        buttonHoverBg: 'rgba(255, 255, 255, 0.24)',
        hintColor: 'rgba(255,255,255,0.82)',
        hint: '點擊卡片外的背景，切換回天空藍模式。'
      }
    ];

    let current = 0;

    function applyVisualTheme(theme) {
      root.style.setProperty('--text', theme.text);
      root.style.setProperty('--muted', theme.muted);
      root.style.setProperty('--card', theme.card);
      root.style.setProperty('--border', theme.border);
      root.style.setProperty('--shadow', theme.shadow);
      root.style.setProperty('--button-bg', theme.buttonBg);
      root.style.setProperty('--button-text', theme.buttonText);
      root.style.setProperty('--button-border', theme.buttonBorder);
      root.style.setProperty('--button-hover-bg', theme.buttonHoverBg);
      root.style.setProperty('--hint', theme.hintColor);
      hint.textContent = theme.hint;
    }

    async function ensureBingImage() {
      if (bingImageUrl) return bingImageUrl;
      try {
        const res = await fetch('https://bing.biturl.top/?resolution=1920&format=json');
        const data = await res.json();
        bingImageUrl = data.url;
        return bingImageUrl;
      } catch (error) {
        bingImageUrl = '';
        return '';
      }
    }

    async function applyTheme(index) {
      const theme = themes[index];
      applyVisualTheme(theme);

      if (theme.mode === 'bing') {
        const imageUrl = await ensureBingImage();
        if (imageUrl) {
          document.body.style.background = `linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.42)), url(${imageUrl}) center / cover fixed`;
        } else {
          document.body.style.background = theme.background;
          hint.textContent = 'Bing 壁紙載入失敗，點背景切換回天空藍模式。';
        }
      } else {
        document.body.style.background = theme.background;
      }
    }

    document.body.addEventListener('click', async (event) => {
      if (event.target.closest('.card')) return;
      current = (current + 1) % themes.length;
      await applyTheme(current);
    });

    applyTheme(current);
  </script>
</body>
</html>
