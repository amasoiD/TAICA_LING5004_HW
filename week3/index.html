<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彭祈文｜數位名片</title>
  <style>
    :root {
      --bg: #eef6ff;
      --card: rgba(255, 255, 255, 0.82);
      --text: #202124;
      --muted: #5f6368;
      --border: rgba(60, 64, 67, 0.12);
      --shadow: 0 20px 50px rgba(82, 115, 153, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7)), var(--bg);
      color: var(--text);
      transition: background 0.5s ease;
      cursor: pointer;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 40px 28px 32px;
      text-align: center;
      cursor: default;
    }

    .avatar {
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 35% 35%, #ffffff 0%, #d9ebff 40%, #b5d3f5 100%);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 10px 30px rgba(110, 154, 201, 0.22);
      display: grid;
      place-items: center;
      color: #6f8fb3;
      font-size: 14px;
      letter-spacing: 0.08em;
      transition: transform 0.25s ease;
    }

    .avatar:hover {
      transform: scale(1.03) rotate(2deg);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 26ch;
      line-height: 1.7;
      color: var(--muted);
      font-size: 1rem;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(60, 64, 67, 0.1);
      border-radius: 999px;
      padding: 12px 18px;
      min-width: 112px;
      font-size: 0.96rem;
      font-weight: 500;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 6px 20px rgba(80, 110, 140, 0.08);
    }

    .button:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 10px 24px rgba(80, 110, 140, 0.12);
    }

    .hint {
      margin-top: 22px;
      font-size: 0.84rem;
      color: #7a8696;
    }

    @media (max-width: 520px) {
      .card {
        padding: 32px 20px 24px;
        border-radius: 24px;
      }

      .avatar {
        width: 120px;
        height: 120px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body id="page">
  <main class="card">
    <div class="avatar" aria-label="大頭照佔位符">PHOTO</div>
    <h1>彭祈文</h1>
    <p class="subtitle">我是熱愛運動的交大學生。</p>

    <div class="actions">
      <a class="button" href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="button" href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="button" href="mailto:hello@example.com">Email</a>
    </div>

    <p class="hint">點擊背景，會隨機切換天空藍系背景。</p>
  </main>

  <script>
    const page = document.getElementById('page');
    const skyThemes = [
      'linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7)), #eef6ff',
      'linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.72)), #dff1ff',
      'linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.74)), #d7ebff',
      'linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.7)), #cfe7ff',
      'linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.75)), #e5f4ff',
      'linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.7)), #d9f0ff'
    ];

    let current = 0;

    document.body.addEventListener('click', (event) => {
      if (event.target.closest('.card')) return;
      let next = current;
      while (next === current) {
        next = Math.floor(Math.random() * skyThemes.length);
      }
      current = next;
      document.body.style.background = skyThemes[current];
    });
  </script>
</body>
</html>
